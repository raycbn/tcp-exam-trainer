<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes de cuenta | TCP Exam Trainer</title>
    <meta name="theme-color" content="#08111e">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="account">

    <main class="page-shell">

        <section class="dashboard-panel profile-hero">
            <img
                src="images/pilot-avatar.png"
                id="accountAvatar"
                class="profile-avatar-large"
                alt="Avatar de la cuenta">

            <div class="profile-head-copy">
                <p class="brand-kicker">Cuenta</p>
                <h1>Ajustes de cuenta</h1>
                <p class="brand-subtitle" id="accountEmail">Cargando correo...</p>
            </div>

            <div class="profile-actions">
                <a class="profile-action-link" href="index.html">← Volver al inicio</a>
                <a class="profile-action-link" href="profile.html">👨‍✈️ Ver perfil</a>
            </div>
        </section>

        <section class="dashboard-summary">
            <div class="dashboard-panel">
                <h2>Información de acceso</h2>

                <div class="activity-line">
                    <span class="activity-label">Correo</span>
                    <span class="activity-value" id="accountEmailValue">—</span>
                </div>

                <div class="activity-line">
                    <span class="activity-label">UID</span>
                    <span class="activity-value" id="accountUid">—</span>
                </div>

                <div class="activity-line">
                    <span class="activity-label">Alta</span>
                    <span class="activity-value" id="accountCreated">—</span>
                </div>

                <div class="activity-line">
                    <span class="activity-label">Verificado</span>
                    <span class="activity-value" id="accountVerified">—</span>
                </div>
            </div>

            <div class="dashboard-panel">
                <h2>Acciones</h2>

                <button class="profile-action-link" id="resetPasswordBtn" type="button">
                    🔑 Enviar correo para cambiar contraseña
                </button>

                <button class="profile-action-link" id="accountLogoutBtn" type="button">
                    ⏻ Cerrar sesión
                </button>

                <p id="accountMessage" class="brand-subtitle" style="margin-top:18px; max-width:none;"></p>
            </div>
        </section>

    </main>

    <script type="module" src="js/guard.js"></script>
    <script type="module" src="js/account.js"></script>
</body>
</html>
