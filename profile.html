<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Perfil | TCP Exam Trainer</title>

    <meta
        name="theme-color"
        content="#08111e">

    <link
        rel="stylesheet"
        href="css/styles.css">

</head>


<body data-page="profile">


<main class="page-shell">


<!-- =========================
     PROFILE HERO
========================== -->


<section class="dashboard-panel profile-main-card">


    <img
        src="images/pilot-avatar.png"
        class="profile-avatar-large"
        alt="Alumno">


    <div>


        <p class="brand-kicker">

            Perfil del alumno

        </p>


        <h1 id="profileName">

            Alumno

        </h1>


        <p
            class="brand-subtitle"
            id="profileEmail">

            Cargando...

        </p>


        <p class="profile-mini-info">

            👨‍✈️ Alumno TCP · Elite Aircrew

        </p>


    </div>



    <div class="profile-actions">


        <a
            class="profile-action-link"
            href="index.html">

            ← Volver al inicio

        </a>


        <a
            class="profile-action-link"
            href="account.html">

            ⚙️ Ajustes de cuenta

        </a>


    </div>


</section>





<!-- =========================
     STATS
========================== -->


<section class="metric-grid">


<article class="metric-card">

<span class="metric-label">
Aciertos
</span>

<span
class="metric-value"
id="profileCorrect">

0

</span>

<span class="metric-note">

Total acumulado.

</span>

</article>




<article class="metric-card">

<span class="metric-label">

Errores

</span>

<span
class="metric-value"
id="profileWrong">

0

</span>

<span class="metric-note">

A mejorar.

</span>

</article>





<article class="metric-card">

<span class="metric-label">

Favoritas

</span>


<span
class="metric-value"
id="profileFavorites">

0

</span>


<span class="metric-note">

Guardadas.

</span>

</article>





<article class="metric-card">

<span class="metric-label">

Simulacros

</span>


<span
class="metric-value"
id="profileSimulations">

0

</span>


<span class="metric-note">

Realizados.

</span>

</article>


</section>





<!-- =========================
     PERFORMANCE
========================== -->


<section class="dashboard-panel">


<h2>

🏆 Rendimiento

</h2>



<div class="activity-line">

<span class="activity-label">

Mejor nota

</span>


<span
class="activity-value"
id="profileBestScore">

—

</span>

</div>




<div class="activity-line">

<span class="activity-label">

Última nota

</span>


<span
class="activity-value"
id="profileLastScore">

—

</span>

</div>





<div class="activity-line">


<span class="activity-label">

Último simulacro

</span>


<span
class="activity-value"
id="profileLastDate">

—

</span>


</div>





<div class="activity-line">


<span class="activity-label">

Preguntas vistas

</span>


<span
class="activity-value"
id="profileSeenQuestions">

0

</span>


</div>



</section>



</main>



<script
type="module"
src="js/guard.js">
</script>


<script
type="module"
src="js/profile.js">
</script>

<script 
type="module"
src="js/user-sync.js">
</script>

</body>

</html>
