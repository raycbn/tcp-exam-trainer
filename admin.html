<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | TCP Exam Trainer</title>
    <meta name="theme-color" content="#08111e">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="admin">

    <main class="page-shell">

        <section class="dashboard-panel profile-main-card">
            <img
                src="images/pilot-avatar.png"
                class="profile-avatar-large"
                alt="Panel admin">

            <div>
                <p class="brand-kicker">Panel administrador</p>
                <h1>Administración</h1>
                <p class="brand-subtitle" id="adminUserEmail">Cargando acceso...</p>
                <p class="profile-mini-info">Solo acceso interno</p>
            </div>

            <div class="profile-actions">
                <a class="profile-action-link" href="admin-users.html">👥 Gestión de usuarios</a>
                <a class="profile-action-link" href="admin-questions.html">❓ Gestión de preguntas</a>
            </div>
        </section>

        <section class="dashboard-summary">
            <div class="dashboard-panel">
                <h2>Resumen</h2>

                <div class="activity-line">
                    <span class="activity-label">Usuarios registrados</span>
                    <span class="activity-value" id="adminUsersCount">—</span>
                </div>

                <div class="activity-line">
                    <span class="activity-label">Preguntas en Firestore</span>
                    <span class="activity-value" id="adminQuestionsCount">—</span>
                </div>

                <div class="activity-line">
                    <span class="activity-label">Preguntas JSON</span>
                    <span class="activity-value" id="adminJsonCount">—</span>
                </div>

                <div class="activity-line">
                    <span class="activity-label">Total combinado</span>
                    <span class="activity-value" id="adminTotalCount">—</span>
                </div>
            </div>

            <div class="dashboard-panel">
                <h2>Acciones rápidas</h2>

                <button class="admin-quick-btn" id="reloadStatsBtn" type="button">
                    🔄 Recargar estadísticas
                </button>

                <button class="admin-quick-btn logout-btn" id="adminLogoutBtn" type="button">
                    🚪 Cerrar sesión
                </button>

                <p id="adminMessage" class="brand-subtitle" style="margin-top:20px;max-width:none;"></p>
            </div>
        </section>

        <section class="dashboard-panel">
            <h2>Acceso rápido</h2>

            <div class="profile-actions">
                <a class="profile-action-link" href="admin-users.html">👥 Ir a usuarios</a>
                <a class="profile-action-link" href="admin-questions.html">❓ Ir a preguntas</a>
            </div>
        </section>

    </main>

    <script type="module" src="js/guard.js"></script>
    <script type="module" src="js/admin-guard.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
