<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - TCP Exam Trainer</title>

    <meta
        name="theme-color"
        content="#08111e">

    <link
        rel="stylesheet"
        href="css/styles.css">

</head>

<body>

    <main class="page-shell">

        <section class="brand-hero">

            <img
                src="images/elite_aircrew_logo_horizontal_1tinta_positivo_SIN_TAGLINE.png"
                class="brand-logo"
                alt="Elite Aircrew">

            <div class="brand-copy">

                <p class="brand-kicker">
                    TCP EXAM TRAINER
                </p>

                <h1>
                    Acceso alumnos
                </h1>

                <p class="brand-subtitle">
                    Inicia sesión para guardar tu progreso, simulacros, errores y estadísticas.
                </p>

            </div>

        </section>

        <section class="dashboard-panel auth-panel">

            <h2>
                🔐 Iniciar sesión
            </h2>

            <input
                id="email"
                class="auth-input"
                type="email"
                placeholder="Correo electrónico">

            <input
                id="password"
                class="auth-input"
                type="password"
                placeholder="Contraseña">

            <button
                id="loginBtn"
                class="tool-card">

                🔓 Entrar

            </button>

            <button
                id="resetBtn"
                class="tool-card">

                🔑 Recuperar contraseña

            </button>

            <p id="authMessage"></p>

        </section>

    </main>

    <script
        type="module"
        src="js/auth.js">
    </script>

</body>

</html>
